{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1>Log in</h1>
<form method="post" class="panel stacked">
  {% csrf_token %}
  {{ form.as_p }}
  <input type="hidden" name="next" value="{{ next }}">
  <button>Log in</button>
  <span class="muted">No account yet? <a href="{% url 'register' %}">Register</a></span>
</form>
{% endblock %}
