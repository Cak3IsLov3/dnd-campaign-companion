{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<h1>Create an account</h1>
<form method="post" class="panel stacked">
  {% csrf_token %}
  {{ form.as_p }}
  <button>Register</button>
  <span class="muted">Already registered? <a href="{% url 'login' %}">Log in</a></span>
</form>
{% endblock %}
